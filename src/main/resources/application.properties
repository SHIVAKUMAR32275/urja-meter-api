
spring.application.name=urja-meter-api

server.port=8081

# Urja Meter Ops portal configuration
urja.portal.base-url=https://urja-ops.flockenergy.tech
urja.portal.username=${URJA_PORTAL_USERNAME}
urja.portal.password=${URJA_PORTAL_PASSWORD}

# Actuator health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
